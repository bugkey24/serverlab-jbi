# Campus Reverse Proxy Simulator
# Simulates https://tajbi.poliwangi.ac.id/jbi24061/ on localhost:8080/jbi24061/

server {
    listen 80;
    server_name localhost;

    # Campus host routing simulation: path prefix /jbi24061/ -> forwarded to container port 80
    location /jbi24061/ {
        proxy_pass http://campus-lamp:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /jbi24061;
    }

    # Redirect root to subpath for easy browser preview
    location = / {
        return 302 /jbi24061/;
    }
}
