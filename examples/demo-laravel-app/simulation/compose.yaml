name: simulate-campus-track1

services:
  # Upstream Campus Reverse Proxy (tajbi.poliwangi.ac.id simulation)
  campus-edge:
    image: nginx:alpine
    container_name: simulate-campus-edge
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./campus-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - campus-lamp

  # Simulated TurnKey LAMP Instance (Apache + PHP in /var/www/laravel)
  campus-lamp:
    build:
      context: ..
      dockerfile: simulation/Dockerfile.lamp
    container_name: simulate-campus-lamp
    restart: unless-stopped
    environment:
      - APP_NAME=ServerLab Pulse
      - APP_URL=http://localhost:8080/jbi24061
      - APP_PATH_PREFIX=jbi24061
      - DB_CONNECTION=mysql
      - DB_HOST=campus-mariadb
      - DB_PORT=3306
      - DB_DATABASE=db_serverlab
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - SESSION_DRIVER=cookie
      - CACHE_STORE=file
    volumes:
      - ../src:/var/www/laravel

  # Simulated Native MariaDB on host
  campus-mariadb:
    image: mariadb:10.11
    container_name: simulate-campus-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_serverlab
    volumes:
      - ../src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  # Simulated Adminer UI (to test GUI database management without CLI)
  campus-adminer:
    image: adminer:latest
    container_name: simulate-campus-adminer
    restart: unless-stopped
    ports:
      - "12322:8080"
    depends_on:
      - campus-mariadb
